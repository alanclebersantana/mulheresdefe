<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mulheres de Fé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6ef; --card:#ffffff; --ink:#3d3029; --muted:#a08f83; --line:#f0e6db;
  --pri:#ff8f70; --pri2:#ffb39e; --ok:#3fae7a; --erro:#e0607e; --choc:#7a4a2e;
  --sombra:0 10px 30px rgba(120,80,50,.10); --r:22px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:'Nunito',system-ui,sans-serif; min-height:100vh; line-height:1.45}
h1,h2,h3,.marca{font-family:'Fredoka',system-ui,sans-serif; font-weight:600; margin:0; letter-spacing:.2px}
h2{font-size:1.35rem} h3{font-size:1.05rem; margin:1.2rem 0 .5rem}
p{margin:.4rem 0}
.muted{color:var(--muted)} .pequeno{font-size:.85rem}
button,.btn{
  font:inherit; font-weight:700; cursor:pointer; border:2px solid var(--line); background:#fff; color:var(--ink);
  padding:.6rem 1.1rem; border-radius:999px; transition:transform .12s, border-color .15s, background .15s; display:inline-flex; align-items:center; gap:.45rem;
}
button:hover,.btn:hover{border-color:var(--pri2)}
button:active{transform:scale(.96)}
button.prim{background:var(--pri); border-color:var(--pri); color:#fff}
button.prim:hover{background:#ff7d5a}
button:disabled{opacity:.4; cursor:not-allowed}
button.grande{padding:.9rem 1.5rem; font-size:1.05rem; justify-content:center}
button.link{background:none; border:none; color:var(--muted); text-decoration:underline; padding:.3rem}
button.mini-btn{padding:.25rem .7rem; font-size:.8rem}
input,textarea{font:inherit; background:#fff; color:var(--ink); border:2px solid var(--line); border-radius:14px; padding:.65rem .85rem; width:100%}
input:focus,textarea:focus{outline:none; border-color:var(--pri2)}
textarea{resize:vertical; min-height:70px}
label{display:block; font-size:.85rem; font-weight:700; color:var(--muted); margin:.8rem 0 .3rem}
.card{background:var(--card); border-radius:var(--r); padding:1.3rem; box-shadow:var(--sombra)}
.linha{display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; margin-top:1rem}
.sp{flex:1}
.dot{width:12px; height:12px; border-radius:50%; background:var(--cor,#ccc); display:inline-block; flex:none}
.badge{display:inline-block; padding:.2rem .65rem; border-radius:99px; font-size:.8rem; font-weight:800}
.badge.ok{background:#3fae7a1f; color:var(--ok)} .badge.erro{background:#e0607e1f; color:var(--erro)} .badge.neutro{background:#a08f831f; color:var(--muted)}
.aviso{background:#fff3e0; color:#b26a1e; border-radius:99px; padding:.35rem .8rem; font-size:.8rem; font-weight:700}
.circ{border-radius:50%; object-fit:cover; background:#f3ebe2; box-shadow:0 0 0 6px #fff, 0 12px 30px rgba(120,80,50,.18)}
.bis-row{display:flex; flex-wrap:wrap; gap:4px; align-items:center}
.bis-ic{width:26px; height:12px; display:block}
@keyframes pula{0%{transform:translateY(0)}40%{transform:translateY(-8px)}100%{transform:translateY(0)}}
@keyframes surge{from{opacity:0; transform:translateY(14px) scale(.98)}to{opacity:1; transform:none}}
@keyframes pop{0%{transform:scale(.6); opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1); opacity:1}}

/* ===== Condutor ===== */
.topo{display:flex; align-items:center; gap:.8rem; padding:1rem 1.5rem; flex-wrap:wrap}
.topo .marca{font-size:1.5rem; color:var(--pri)}
.tag{font-size:.72rem; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); background:#fff; border-radius:99px; padding:.25rem .7rem; font-weight:800}
.wrap{max-width:1080px; margin:0 auto; padding:0 1.5rem 2rem; display:grid; gap:1.2rem}
.duas{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:.8rem}
.eq-nome{display:flex; align-items:center; gap:.5rem}
.grade{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:.7rem; margin-top:.8rem}
.pchip{display:flex; align-items:center; gap:.6rem; padding:.5rem .7rem; border:2px solid var(--line); border-radius:999px; cursor:pointer; background:#fff; margin:0; color:var(--ink); font-size:.95rem; font-weight:700}
.pchip:has(input:checked){border-color:var(--pri); background:#fff4ef}
.pchip input{width:auto; accent-color:var(--pri)}
.pchip img{width:40px; height:40px; border-radius:50%; object-fit:cover}
.rodape-acoes{display:flex; gap:.6rem; justify-content:flex-end; flex-wrap:wrap}
.jogo{max-width:1240px; margin:0 auto; padding:0 1.5rem 2rem; display:grid; grid-template-columns:1fr 320px; gap:1.2rem}
@media (max-width:900px){.jogo{grid-template-columns:1fr}}
.pers-topo{display:flex; gap:1rem; align-items:center; flex-wrap:wrap}
.pers-topo img{width:76px; height:76px}
.pers-topo h2{color:var(--pri)}
.stepper{display:flex; gap:.3rem; flex-wrap:wrap; margin-left:auto}
.stepper span{font-size:.75rem; padding:.3rem .7rem; border-radius:99px; background:#f6efe7; color:var(--muted); font-weight:800}
.stepper span.on{background:var(--pri); color:#fff}
.dicas-c{display:grid; gap:.5rem; margin-top:1rem}
.dica-c{border:2px dashed var(--line); border-radius:16px; padding:.7rem .95rem; opacity:.55}
.dica-c.on{opacity:1; border-style:solid; border-color:var(--pri2); background:#fff8f4}
.dica-c .vale{float:right; font-size:.8rem; color:var(--muted); font-weight:700}
.resps{display:grid; gap:.5rem}
.resp{display:flex; align-items:center; gap:.6rem; padding:.65rem .9rem; background:#fbf7f2; border-radius:16px; border-left:5px solid var(--cor); flex-wrap:wrap}
.resp-st{margin-left:auto; display:flex; align-items:center; gap:.4rem; flex-wrap:wrap}
.txt-resp{font-style:italic}
.lado{display:grid; gap:1rem; align-content:start}
.placar-l{display:grid; gap:.6rem}
.placar-l .it{padding:.7rem .9rem; background:#fbf7f2; border-radius:16px; border-left:5px solid var(--cor)}
.placar-l .it .cab{display:flex; align-items:center; gap:.5rem; font-weight:800}
.placar-l .it .cab b{margin-left:auto; font-family:'Fredoka',sans-serif; font-size:1.4rem; color:var(--choc)}
.placar-l .bis-row{margin-top:.4rem}
.codigo-g{font-family:'Fredoka',sans-serif; font-size:2.3rem; letter-spacing:.25em; color:var(--pri)}
.texto-prev{background:#fbf7f2; border-radius:16px; padding:.85rem 1rem; white-space:pre-wrap}
.perg-c{background:#fbf7f2; border-radius:16px; padding:.85rem 1rem; margin-top:.6rem}
.perg-c.feita{opacity:.6}
.perg-c .quem{font-size:.85rem; color:var(--muted); font-weight:700}

/* modal */
.modal-fundo{position:fixed; inset:0; background:rgba(61,48,41,.35); display:flex; align-items:center; justify-content:center; padding:1rem; z-index:20}
.modal{background:var(--bg); border-radius:var(--r); width:min(1000px,100%); max-height:92vh; display:flex; flex-direction:column; box-shadow:0 30px 80px rgba(0,0,0,.2)}
.modal header,.modal footer{display:flex; align-items:center; gap:.6rem; padding:1rem 1.3rem}
.modal footer{flex-wrap:wrap; border-top:2px solid var(--line)}
.ed-grid{display:grid; grid-template-columns:210px 1fr; overflow:hidden; min-height:0; flex:1}
@media (max-width:700px){.ed-grid{grid-template-columns:1fr}.ed-lista{max-height:150px}}
.ed-lista{overflow:auto; padding:.6rem; display:grid; gap:.3rem; align-content:start}
.ed-lista button{justify-content:flex-start; border-color:transparent; background:none; padding:.45rem .8rem}
.ed-lista button img{width:28px; height:28px; border-radius:50%; object-fit:cover}
.ed-lista button.ativo{background:#fff; border-color:var(--pri2)}
.ed-form{overflow:auto; padding:0 1.3rem 1.3rem}
.ed-form fieldset{border:2px solid var(--line); border-radius:16px; padding:.4rem 1rem 1rem; margin:1rem 0 0}
.ed-form legend{font-family:'Fredoka',sans-serif; font-weight:600; padding:0 .4rem}

/* ===== TV ===== */
.tv{min-height:100vh; padding:3vh 4vw 0; display:flex; flex-direction:column}
.tv-topo{display:flex; align-items:center; gap:1rem}
.tv-topo .marca{font-size:clamp(1.2rem,2vw,2.2rem); color:var(--pri)}
.tv-topo .contador{margin-left:auto; color:var(--muted); font-weight:700; font-size:clamp(1rem,1.4vw,1.6rem)}
.tv-meio{flex:1; display:flex; align-items:center; padding:3vh 0}
.tv-adv{display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr); gap:5vw; align-items:center; width:100%}
.tv-adv .circ{width:min(100%,38vw); aspect-ratio:1/1; display:block; margin:0 auto; animation:pop .6s ease}
.valendo{display:inline-flex; align-items:center; gap:.5em; background:#fff; box-shadow:var(--sombra); padding:.5em 1.1em; border-radius:99px; font-weight:800; font-size:clamp(1rem,1.5vw,1.7rem); margin-bottom:2.2vh}
.valendo .bis-ic{width:2.2em; height:1em}
.dica{border-radius:24px; padding:1.8vh 1.8vw; margin-bottom:1.6vh; background:#fff; box-shadow:var(--sombra)}
.dica .dn{font-size:clamp(.8rem,1vw,1.1rem); text-transform:uppercase; letter-spacing:.15em; color:var(--pri); font-weight:800}
.dica p{font-family:'Fredoka',sans-serif; font-weight:500; font-size:clamp(1.2rem,2.1vw,2.5rem); margin:.2em 0 0; line-height:1.25}
.dica.off{background:transparent; box-shadow:none; border:3px dashed var(--line)}
.dica.off p{color:#d9cabd}
.dica.on{animation:surge .5s ease}
.status-eq{display:flex; gap:1vw; flex-wrap:wrap; margin-top:1vh}
.chip-eq{display:flex; align-items:center; gap:.5em; padding:.45em 1em; border-radius:99px; background:#fff; font-weight:800; font-size:clamp(.9rem,1.2vw,1.4rem); box-shadow:var(--sombra)}
.chip-eq.feito{background:var(--cor); color:#fff}
.chip-eq.feito .dot{background:#fff}
.placar-bar{display:flex; gap:2vw; justify-content:center; padding:2vh 0 3vh; flex-wrap:wrap}
.placar-bar .it{display:flex; align-items:center; gap:.8em; background:#fff; box-shadow:var(--sombra); border-radius:99px; padding:.55em 1.3em; font-weight:800; font-size:clamp(1rem,1.4vw,1.6rem)}
.placar-bar .it b{font-family:'Fredoka',sans-serif; color:var(--choc); font-size:1.35em}
.placar-bar .bis-ic{width:1.9em; height:.85em}
.eyebrow{text-transform:uppercase; letter-spacing:.2em; color:var(--pri); font-weight:800; font-size:clamp(.9rem,1.3vw,1.5rem)}
.nome-grande{font-size:clamp(3rem,7vw,8rem); color:var(--ink); line-height:1.05; margin:.1em 0 .35em; animation:pop .6s ease}
.resultados{display:grid; gap:1.4vh}
.res-it{display:flex; align-items:center; gap:1vw; background:#fff; box-shadow:var(--sombra); border-left:8px solid var(--cor); border-radius:20px; padding:1.4vh 1.5vw; font-size:clamp(1rem,1.5vw,1.8rem); animation:surge .5s ease both}
.res-it:nth-child(2){animation-delay:.15s}
.res-it .r{margin-left:auto; font-weight:800; text-align:right}
.res-it .r.ok{color:var(--ok)} .res-it .r.erro{color:var(--erro)}
.tv-centro{text-align:center; width:100%; max-width:1400px; margin:0 auto}
.pergunta{font-size:clamp(2rem,4.4vw,5rem); line-height:1.15; margin:.3em 0}
.pergunta em{color:var(--pri); font-style:normal}
.texto-tv{font-size:clamp(1.2rem,2vw,2.3rem); text-align:left; background:#fff; box-shadow:var(--sombra); border-radius:28px; padding:3vh 3vw; margin-top:3vh; line-height:1.5}
.lobby-g{display:grid; grid-template-columns:1.2fr 1fr; gap:4vw; align-items:center; text-align:left}
.lobby-g .banner{width:100%; border-radius:32px; box-shadow:var(--sombra)}
.lobby-g .qr{width:clamp(150px,14vw,260px); border-radius:20px; background:#fff; padding:10px; box-shadow:var(--sombra)}
.titulo-tv{font-size:clamp(3rem,6.5vw,7.5rem); color:var(--pri); line-height:1}
.sorteio{display:inline-block; margin-top:4vh; padding:.35em 1.2em; border-radius:99px; background:#fff; box-shadow:var(--sombra); font-family:'Fredoka',sans-serif; font-weight:600; font-size:clamp(2.5rem,6vw,7rem); min-width:50vw; border:6px solid transparent}
.sorteio.girando{border-color:var(--line)}
.sorteio.final{border-color:var(--pri); color:var(--pri); animation:pop .5s ease}
.podio{display:grid; gap:2vh; max-width:1000px; margin:4vh auto 0}
.podio .it{display:flex; align-items:center; gap:1.5vw; background:#fff; box-shadow:var(--sombra); border-left:10px solid var(--cor); border-radius:24px; padding:2vh 2vw; font-size:clamp(1.2rem,2.2vw,2.6rem); font-weight:800}
.podio .it.primeiro{box-shadow:0 0 0 4px var(--pri2), var(--sombra)}
.podio .bis-row{margin-left:auto; max-width:45%; justify-content:flex-end}
.podio .bis-ic{width:1.6em; height:.75em}
.podio b{font-family:'Fredoka',sans-serif; color:var(--choc); min-width:2.2em; text-align:right}
#videoLayer{position:fixed; left:4vw; right:4vw; top:15vh; bottom:4vh; display:flex; align-items:center; justify-content:center; z-index:4}
#videoLayer[hidden]{display:none}
#videoLayer video{max-width:100%; max-height:100%; border-radius:28px; box-shadow:0 20px 60px rgba(0,0,0,.25); background:#000}
#ativar{position:fixed; inset:0; background:rgba(251,246,239,.92); display:flex; align-items:center; justify-content:center; z-index:30}
#ativar[hidden]{display:none}
.confete{position:fixed; top:-20px; width:12px; height:18px; border-radius:4px; z-index:25; pointer-events:none; animation:cai linear forwards}
@keyframes cai{to{transform:translateY(110vh) rotate(720deg)}}

/* ===== Celular ===== */
.cel{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding:1rem}
.cel-topo{padding:.9rem 1.1rem; background:#fff; border-radius:20px; box-shadow:var(--sombra); border-top:6px solid var(--cor)}
.cel-topo .cab{display:flex; align-items:center; gap:.6rem}
.cel-topo .cab b.n{margin-left:auto; font-family:'Fredoka',sans-serif; font-size:1.5rem; color:var(--choc)}
.cel-topo .bis-row{margin-top:.5rem}
.cel-corpo{flex:1; display:flex; flex-direction:column; justify-content:center; padding:1.5rem 0}
.cel-msg{text-align:center; animation:surge .4s ease}
.cel-msg .emoji{font-size:3.5rem}
.cel-msg h2{margin:.4rem 0}
.vale-cel{font-family:'Fredoka',sans-serif; font-size:1.3rem; color:var(--pri); margin:.3rem 0 .8rem; text-align:center}
.cel-q input{font-size:1.35rem; padding:.95rem 1.1rem; margin-bottom:.8rem; text-align:center; border-radius:999px}
.cel-q button{width:100%}
.cel-q label{text-align:center}
.eq-escolha{display:grid; gap:.8rem; margin-top:1rem}
.eq-escolha button{justify-content:center; padding:1.1rem; font-size:1.15rem; background:var(--cor); border-color:var(--cor); color:#fff}
.tela-centro{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem}
.estreito{width:min(420px,100%); text-align:center}
.estreito .marca{font-size:2.1rem; color:var(--pri)}
.estreito button{width:100%; margin-top:1rem}
</style>
</head>

function paint(html){
  const a = document.activeElement;
  let foco = null;
  if (a && a.id && app.contains(a) && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'))
    foco = { id:a.id, s:a.selectionStart, e:a.selectionEnd };
  const vals = {};
  app.querySelectorAll('input[id],textarea[id]').forEach(el => { if (el.type !== 'checkbox' && el.type !== 'file') vals[el.id] = el.value; });
  app.innerHTML = html;
  Object.entries(vals).forEach(([id, v]) => { const el = document.getElementById(id); if (el && app.contains(el) && el.type !== 'file') el.value = v; });
  if (foco){ const el = document.getElementById(foco.id); if (el){ el.focus(); try{ el.setSelectionRange(foco.s, foco.e); }catch(_){} } }
}
function loadScript(src){
  return new Promise((ok, falha) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => falha(new Error('Não carregou ' + src)); document.head.appendChild(s); });
}
function confete(qtd = 70){
  const cores = ['#ff8f70','#5cb8d6','#ffd36e','#9fdcc8','#f4a7b9','#7a4a2e'];
  for (let i = 0; i < qtd; i++){
    const c = document.createElement('div'); c.className = 'confete';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cores[i % cores.length];
    c.style.animationDuration = (1.8 + Math.random() * 1.6) + 's'; c.style.animationDelay = (Math.random() * .4) + 's';
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 4200);
  }
}

  },
  _root(){ return LS.get(LOCAL_KEY, {}); },
  _get(path){ return path.split('/').filter(Boolean).reduce((o, k) => (o == null || o[k] === undefined) ? null : o[k], this._root()); },
  _write(path, fn){
    const root = this._root(); const ks = path.split('/').filter(Boolean); let o = root;
    for (let i = 0; i < ks.length - 1; i++){ if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
    const last = ks[ks.length - 1];
    const nv = fn(o[last] === undefined ? null : o[last]);
    if (nv === null) delete o[last]; else o[last] = nv;
    LS.set(LOCAL_KEY, root); this._notify();
  },
  _notify(){ this.listeners.forEach(l => l.cb(clone(this._get(l.path)))); },
  on(path, cb){
    if (this.modo === 'firebase'){ const r = this.db.ref(path); const h = r.on('value', s => cb(s.val())); return () => r.off('value', h); }
    const l = { path, cb }; this.listeners.push(l); setTimeout(() => cb(clone(this._get(path))));
    return () => { this.listeners = this.listeners.filter(x => x !== l); };
  },
  set(path, val){
    val = clone(val);
    if (this.modo === 'firebase') return this.db.ref(path).set(val);
    this._write(path, () => val); return Promise.resolve();
  },
  update(path, obj){
    obj = clone(obj);
    if (this.modo === 'firebase') return this.db.ref(path).update(obj);
    this._write(path, cur => { const n = Object.assign({}, cur || {}); Object.entries(obj).forEach(([k, v]) => { if (v === null) delete n[k]; else n[k] = v; }); return n; });
    return Promise.resolve();
  },
  async claim(path, val){
    val = clone(val);
    if (this.modo === 'firebase'){ const r = await this.db.ref(path).transaction(cur => cur === null ? val : undefined); return r.committed; }
    if (this._get(path) != null) return false;
    this._write(path, () => val); return true;
  }
};

/* ===================== conferência de resposta ===================== */
const STOP = new Set(['a','o','as','os','de','da','do','das','dos','e','um','uma']);
function norm(s){
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(w => w && !STOP.has(w)).join(' ');
}
function lev(a, b){
  if (a === b) return 0; const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function distAlias(resp, alias){
  let best = lev(resp, alias);
  const t = resp.split(' '), n = alias.split(' ').length;
  for (let i = 0; i + n <= t.length; i++) best = Math.min(best, lev(t.slice(i, i + n).join(' '), alias));
  return best;
}
function limite(alias){ const L = alias.replace(/ /g, '').length; return L <= 2 ? 0 : L <= 4 ? 1 : L <= 8 ? 2 : 3; }
function avaliar(texto, alvoId){
  const r = norm(texto); if (!r) return false;
  const cands = [];
  todos().forEach(p => p.aceitas.forEach(a => { const n = norm(a); if (n) cands.push({ id:p.id, a:n }); }));
  DISTRATORES.forEach(a => cands.push({ id:'_', a:norm(a) }));
  let melhorD = Infinity, melhorL = -1, ids = new Set();
  cands.forEach(c => {
    const d = distAlias(r, c.a); if (d > limite(c.a)) return;
    const L = c.a.length;
    if (d < melhorD || (d === melhorD && L > melhorL)){ melhorD = d; melhorL = L; ids = new Set([c.id]); }
    else if (d === melhorD && L === melhorL) ids.add(c.id);
  });
  return ids.has(alvoId);
}

/* ===================== bis ===================== */
/* Acertou na dica 1: fica com os bis · dica 2: dá 1 · dica 3: dá 2 · errou ou não respondeu: dá 3.
   Ninguém dá mais bis do que tem. */
function quantoDa(r){ if (!r) return 3; if (!r.avaliado) return 0; return r.certo ? r.dica - 1 : 3; }
function contarBis(s){
  const eqs = s.equipes || []; const t = {}; const mov = {};
  eqs.forEach(e => t[e.id] = BIS_INICIAL);
  const rev = s.reveladas || {};
  const ks = Object.keys(rev).filter(k => rev[k]).sort((a, b) => +a.slice(1) - +b.slice(1));
  ks.forEach(k => {
    const rs = (s.respostas || {})[k] || {}; mov[k] = {};
    const pend = eqs.map(e => ({ e, d: quantoDa(rs[e.id]) }));
    pend.forEach(({ e, d }) => {
      const outro = eqs.find(x => x.id !== e.id); const dado = Math.max(0, Math.min(d, t[e.id]));
      t[e.id] -= dado; if (outro) t[outro.id] += dado;
      mov[k][e.id] = { da: dado, para: outro ? outro.id : null };
    });
  });
  return { t, mov };
}
const nomeEq = (eqs, id) => (eqs.find(e => e.id === id) || {}).nome || '';
function frase(r, m, eqs){
  const para = m ? nomeEq(eqs, m.para) : '';
  if (!r) return m && m.da ? `não respondeu · dá ${bisTxt(m.da)} para ${para}` : 'não respondeu';
  if (!r.avaliado) return 'conferindo…';
  if (r.certo) return (!m || !m.da) ? `acertou na dica ${r.dica} · fica com os bis` : `acertou na dica ${r.dica} · dá ${bisTxt(m.da)} para ${para}`;
  return m && m.da ? `errou · dá ${bisTxt(m.da)} para ${para}` : 'errou';
}
function rankingHTML(equipes, t){
  const ord = [...(equipes || [])].sort((a, b) => t[b.id] - t[a.id]);
  return `<div class="podio">${ord.map((e, i) => `<div class="it ${i === 0 && t[e.id] > t[ord[ord.length-1].id] ? 'primeiro' : ''}" style="--cor:${e.cor}"><span class="dot"></span>${esc(e.nome)}${bisRow(t[e.id])}<b>${t[e.id]}</b></div>`).join('')}</div>`;
}

function avaliarPendentes(){
  if (!sala || !sala.respostas) return;
  Object.entries(sala.respostas).forEach(([k, porEq]) => {
    const P = (sala.conteudo || [])[+k.slice(1)]; if (!P) return;
    Object.entries(porEq || {}).forEach(([eid, r]) => {
      if (r && !r.avaliado) Sync.update(`salas/${code}/respostas/${k}/${eid}`, { avaliado:true, certo: avaliar(r.texto, P.id) });
    });
  });
}

function lerEditor(){
  if (!$('#edAceitas')) return;
  const v = id => ($('#' + id)?.value || '').trim();
  const p = PADRAO.find(x => x.id === edSel); const ed = edicoes(); const e = Object.assign({}, ed[edSel] || {});
  const aceitas = v('edAceitas').split(',').map(s => s.trim()).filter(Boolean);
  const dicas = [0,1,2].map(j => v('edDica' + j));
  if (aceitas.length && JSON.stringify(aceitas) !== JSON.stringify(p.aceitas)) e.aceitas = aceitas; else delete e.aceitas;
  if (!dicas.some(d => !d) && JSON.stringify(dicas) !== JSON.stringify(p.dicas)) e.dicas = dicas; else delete e.dicas;
  const apr = v('edAprender'); if (apr !== (p.aprender || '')) e.aprender = apr; else delete e.aprender;
  if (p.video){ const vid = v('edVideo'); if (vid && vid !== p.video) e.video = vid; else delete e.video; }
  else {
    const pg = [0,1].map(q => ({ texto: v('edPerg' + q), pessoa: v('edPessoa' + q) }));
    if (pg.some(x => x.texto || x.pessoa)) e.perguntas = pg; else delete e.perguntas;
  }
  if (Object.keys(e).length) ed[edSel] = e; else delete ed[edSel];
  LS.set('mdf_edicoes2', ed);
  propagarParaSala(edSel);
}
function propagarParaSala(id){
  if (!code || !sala || !sala.conteudo) return;
  const i = sala.conteudo.findIndex(x => x.id === id);
  if (i >= 0) Sync.set(`salas/${code}/conteudo/${i}`, conteudoSala(id));
}
function trocarImagem(ev){
  const f = ev.target.files[0]; if (!f) return;
  const img = new Image(); const u = URL.createObjectURL(f);
  img.onload = () => {
    const s = 320, cv = document.createElement('canvas'); cv.width = cv.height = s;
    const m = Math.min(img.width, img.height); const ctx = cv.getContext('2d');
    ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
    lerEditor(); const ed = edicoes(); ed[edSel] = Object.assign(ed[edSel] || {}, { img: cv.toDataURL('image/jpeg', .85) });
    LS.set('mdf_edicoes2', ed); propagarParaSala(edSel); URL.revokeObjectURL(u); renderEditor(); if (!code) renderSetup();
  };
  img.src = u;
}
function importarEdicoes(e){
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { const obj = JSON.parse(t); LS.set('mdf_edicoes2', Object.assign(edicoes(), obj)); Object.keys(obj).forEach(propagarParaSala); renderEditor(); alert('Conteúdo importado.'); })
    .catch(() => alert('Arquivo inválido.'));
}

/* sorteio "de mentira": gira os nomes e para em quem já estava definido */
function montarAnim(s){
  if (anims[s.id]) return anims[s.id];
  let nomes = [...new Set([...(sala.participantes || []), s.alvo])].filter(Boolean);
  if (nomes.length < 2) nomes = [s.alvo, '…'];
  const passos = 26, seq = [], tempos = []; let tempo = 0, ult = null;
  for (let i = 0; i < passos; i++){
    let n; do { n = nomes[Math.floor(Math.random() * nomes.length)]; } while (nomes.length > 1 && (n === ult || (i === passos - 2 && n === s.alvo)));
    seq.push(n); ult = n; tempos.push(tempo); tempo += 60 + Math.pow(i / passos, 2.6) * 400;
  }
  seq.push(s.alvo); tempos.push(tempo);
  const a = { seq, tempos, inicio: performance.now(), fim: tempo, pronto: false };
  anims[s.id] = a; requestAnimationFrame(() => girar(s.id)); return a;
}
function nomeAgora(a){
  const el = performance.now() - a.inicio; let i = 0;
  while (i + 1 < a.tempos.length && a.tempos[i + 1] <= el) i++;
  return a.seq[i];
}
function girar(id){
  const a = anims[id]; if (!a || a.pronto) return;
  const el = $('#sorteioNome'); if (el) el.textContent = nomeAgora(a);
  if (performance.now() - a.inicio >= a.fim + 80){ a.pronto = true; confete(60); renderTV(); return; }
  requestAnimationFrame(() => girar(id));
}
function atualizarVideoTV(P, est){
  const vl = $('#videoLayer'); if (!vl) return;
  const mostrar = !!(P && est.fase === 'reflexao' && ehVideo(P));
  vl.hidden = !mostrar;
  if (!mostrar){ if (!tvVideo.paused) tvVideo.pause(); return; }
  if (tvVideoFor !== P.id){ tvVideoFor = P.id; tvVideo.src = P.video; tvVideo.load(); tvVideoCmd = est.video ? est.video.id : null; }
  const cmd = est.video;
  if (cmd && cmd.id !== tvVideoCmd){
    tvVideoCmd = cmd.id;
    if (cmd.acao === 'play') tvVideo.play().catch(() => { $('#ativar').hidden = false; });
    if (cmd.acao === 'pause') tvVideo.pause();
    if (cmd.acao === 'reiniciar'){ tvVideo.currentTime = 0; tvVideo.play().catch(() => {}); }
  }
}

document.addEventListener('click', e => {

    case 'todas': setup.sel = PADRAO.map(p => p.id); salvarSetup(); renderSetup(); break;

    case 'fecharEditor': lerEditor(); modal.innerHTML = ''; if (!code) renderSetup(); break;
    case 'edSel': lerEditor(); edSel = b.dataset.id; renderEditor(); break;
    case 'edSalvar': lerEditor(); renderEditor(); if (!code) renderSetup(); break;
    case 'edImgReset': { lerEditor(); const ed = edicoes(); if (ed[edSel]){ delete ed[edSel].img; LS.set('mdf_edicoes2', ed); } propagarParaSala(edSel); renderEditor(); if (!code) renderSetup(); break; }
    case 'edReset': if (confirm('Voltar esta personagem ao conteúdo padrão? Perguntas, pessoas, textos e imagem alterados nela serão apagados.')){ const ed = edicoes(); delete ed[edSel]; LS.set('mdf_edicoes2', ed); propagarParaSala(edSel); renderEditor(); if (!code) renderSetup(); } break;
    case 'edExport': {
      lerEditor();
      const blob = new Blob([JSON.stringify(edicoes(), null, 2)], { type:'application/json' });
      const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = 'mulheres-de-fe-conteudo.json'; l.click(); URL.revokeObjectURL(u);
      break; }
    case 'abrirTV': window.open(linkTV(code), 'mdf_tv'); break;
    case 'copiar': navigator.clipboard?.writeText(b.dataset.txt).then(() => { b.textContent = 'Copiado!'; setTimeout(() => b.textContent = 'Copiar link', 1500); }); break;
    case 'encerrar': if (confirm('Encerrar esta partida e voltar para a configuração?')) novaPartida(); break;
    case 'novaPartida': novaPartida(); break;
    case 'iniciar': setEstado({ fase:'adivinhar', idx:0, dica:1, nome:null, sorteio:null, video:null }); break;
    case 'dica': setEstado({ dica: Math.min(3, (sala.estado.dica || 1) + 1) }); break;
    case 'revelar': Sync.set(`salas/${code}/reveladas/p${sala.estado.idx}`, true).then(() => setEstado({ fase:'revelado', nome: atual().nome })); break;
    case 'ir': setEstado({ fase: b.dataset.f, sorteio:null, video:null }); break;
    case 'sortear': sortear(+b.dataset.q); break;
    case 'video': setEstado({ video: { acao: b.dataset.v, id: Math.random().toString(36).slice(2, 10) } }); break;
    case 'proxima': {
      const est = sala.estado; const N = (sala.conteudo || []).length;
      if (est.idx + 1 < N) setEstado({ fase:'adivinhar', idx: est.idx + 1, dica:1, nome:null, sorteio:null, video:null }); else setEstado({ fase:'fim', sorteio:null, video:null });
      break; }
    case 'voltar': {
      const est = sala.estado;
      if (est.fase === 'fim') setEstado({ fase:'reflexao' });
      else {
        const i = SEQ.indexOf(est.fase); if (i <= 0) break;
        if (SEQ[i - 1] === 'adivinhar'){ Sync.set(`salas/${code}/reveladas/p${est.idx}`, null); setEstado({ fase:'adivinhar', nome:null }); }
        else setEstado({ fase: SEQ[i - 1], sorteio:null, video:null });
      }
      break; }
    case 'trocar': {
      const r = sala.respostas[b.dataset.k][b.dataset.e];
      Sync.update(`salas/${code}/respostas/${b.dataset.k}/${b.dataset.e}`, { certo: !r.certo, avaliado:true });
      break; }
    case 'entrar': { const c = ($('#codigo')?.value || '').trim().toUpperCase(); if (c.length === 4) location.href = `${BASE_URL}?modo=${MODO}&sala=${c}`; break; }
    case 'outraSala': location.href = `${BASE_URL}?modo=${MODO}`; break;
    case 'escolher': eid = b.dataset.e; LS.set('mdf_eq_' + code, eid); marcarPresenca(); renderEquipe(); break;
    case 'trocarEquipe': eid = null; LS.del('mdf_eq_' + code); renderEquipe(); break;
    case 'enviar': enviarResposta(); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.nome != null){ setup.nomes[+e.target.dataset.nome] = e.target.value; salvarSetup(); }
  if (e.target.dataset.part){ setup.participantes = e.target.value; salvarSetup(); }
});
document.addEventListener('change', e => {
  const id = e.target.dataset.pid; if (!id) return;
  const s = new Set(setup.sel); e.target.checked ? s.add(id) : s.delete(id);
  setup.sel = PADRAO.map(p => p.id).filter(x => s.has(x)); salvarSetup(); renderSetup();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'resp') enviarResposta();
  if (e.target.id === 'codigo') document.querySelector('[data-a="entrar"]')?.click();
});
function novaPartida(){
  if (unsub) unsub(); unsub = null; LS.del('mdf_sala2'); code = null; sala = null; salaCarregada = false; renderSetup();
}

/* ===================== início ===================== */
(async () => {
  try { await Sync.init(); }
  catch (err) { app.innerHTML = `<div class="tela-centro"><div class="card estreito"><h2>Erro ao conectar</h2><p class="muted">${esc(err.message)}</p></div></div>`; return; }
  if (MODO === 'tv') initTV();
  else if (MODO === 'equipe') initEquipe();
  else initCondutor();
})();
</script>
</body>
